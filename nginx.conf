worker_processes auto;
events {
    worker_connections 8192;
}

http {
    server_tokens off;

    # Coarse edge limit for credential endpoints; the app adds per-IP and per-account
    # limits in Redis on top of this.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    upstream waft_cluster {
        least_conn;
        server waft-alpha:8080 max_fails=2 fail_timeout=5s;
        server waft-beta:8080  max_fails=2 fail_timeout=5s;
        keepalive 64;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # Terminate TLS here (or at a load balancer in front) in production:
    #   listen 443 ssl; http2 on;
    #   ssl_certificate /etc/nginx/tls/fullchain.pem;
    #   ssl_certificate_key /etc/nginx/tls/privkey.pem;
    server {
        listen 8080;

        # One upload PATCH is at most WAFT_MAX_CHUNK (16 MiB by default).
        client_max_body_size 20m;

        proxy_http_version 1.1;
        # $http_host keeps the port, so the app's same-origin check matches the browser's Origin.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location ~ ^/v2/auth/(login|register)$ {
            limit_req zone=auth burst=10 nodelay;
            limit_req_status 429;
            proxy_set_header Connection "";
            proxy_pass http://waft_cluster;
        }

        location = /v2/stream {
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_pass http://waft_cluster;
        }

        location / {
            proxy_set_header Connection "";
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_pass http://waft_cluster;
        }
    }
}
